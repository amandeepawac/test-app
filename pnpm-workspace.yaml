packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@prisma/engines": true
  "@parcel/watcher": true
  "@scarf/scarf": false
  "@swc/core": true
  esbuild: true
  prisma: true
  argon2: true
minimumReleaseAgeExclude:
  - "@oxlint-tsgolint/darwin-arm64@7.0.2008"
  - "@oxlint-tsgolint/darwin-x64@7.0.2008"
  - "@oxlint-tsgolint/linux-arm64@7.0.2008"
  - "@oxlint-tsgolint/linux-x64@7.0.2008"
  - "@oxlint-tsgolint/win32-arm64@7.0.2008"
  - "@oxlint-tsgolint/win32-x64@7.0.2008"
  - oxlint-tsgolint@7.0.2008
  - "@nestjs/common@12.6.1"
  - "@nestjs/core@12.6.1"
  - "@nestjs/platform-express@12.6.1"
  - "@nestjs/testing@12.6.1"
  - "@types/node@26.6.10"
  - "@types/react@19.3.2"
  - lucide-react@1.80.0
  - next-intl@4.16.2
  - react-resizable-panels@4.24.2
overrides:
  effect@<=3.22.0: ^3.22.1
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  tmp@<0.2.6: ^0.2.6
  undici@<6.29.1: ^6.29.1
